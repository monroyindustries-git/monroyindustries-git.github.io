<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terms of Service — Scrollmaxxing</title>
    <meta name="description" content="Scrollmaxxing's terms of service.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --cyan: #1BA100;
            --cyan-light: #E1FFDB;
            --cyan-dark: #137200;
            --dark: #0A0A0A;
            --gray-800: #1A1A1A;
            --gray-600: #4A4A4A;
            --gray-400: #8A8A8A;
            --gray-200: #E5E5E5;
            --gray-100: #F5F5F5;
            --white: #FFFFFF;
        }

        body {
            font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
            color: var(--dark);
            background: var(--white);
            -webkit-font-smoothing: antialiased;
        }

        /* NAV */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 100;
            padding: 16px 24px;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 20px;
            font-weight: 700;
            color: var(--dark);
            text-decoration: none;
            letter-spacing: -0.5px;
        }
        .nav-logo img {
            display: block;
            height: 28px;
            width: 28px;
            border-radius: 6px;
        }
        .nav-cta {
            background: var(--dark);
            color: var(--white);
            padding: 10px 20px;
            border-radius: 100px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.2s, opacity 0.2s;
        }
        .nav-cta:hover { opacity: 0.85; transform: scale(0.98); }

        /* PAGE HERO */
        .page-hero {
            padding: 140px 24px 56px;
            text-align: center;
            background: linear-gradient(180deg, var(--cyan-light) 0%, var(--white) 100%);
        }
        .section-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--cyan-dark);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
        }
        .page-hero h1 {
            font-size: clamp(32px, 6vw, 48px);
            font-weight: 700;
            letter-spacing: -1.5px;
            margin-bottom: 16px;
        }
        .page-hero p {
            font-size: 17px;
            color: var(--gray-600);
            max-width: 480px;
            margin: 0 auto;
            line-height: 1.6;
        }
        .page-hero a { color: var(--cyan-dark); font-weight: 600; text-decoration: none; }
        .page-hero a:hover { text-decoration: underline; }

        /* DOC CARD */
        main {
            max-width: 860px;
            margin: 0 auto;
            padding: 0 24px 100px;
        }
        .doc-card {
            background: var(--gray-100);
            border: 1px solid var(--gray-200);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.06);
        }
        .doc-card iframe {
            display: block;
            width: 100%;
            height: 800px;
            border: none;
        }

        /* FOOTER */
        footer {
            background: var(--dark);
            color: rgba(255,255,255,0.5);
            padding: 48px 24px;
        }
        .footer-inner {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 32px;
        }
        .footer-brand {
            font-size: 18px;
            font-weight: 700;
            color: var(--white);
            margin-bottom: 8px;
        }
        .footer-links {
            display: flex;
            gap: 40px;
        }
        .footer-col h4 {
            font-size: 13px;
            font-weight: 600;
            color: var(--white);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .footer-col a {
            display: block;
            color: rgba(255,255,255,0.5);
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 8px;
            transition: color 0.2s;
        }
        .footer-col a:hover { color: var(--white); }

        @media (max-width: 768px) {
            .doc-card iframe { height: 600px; }
            .footer-inner { flex-direction: column; }
            .footer-links { flex-direction: column; gap: 24px; }
        }
    </style>
</head>
<body>

    <!-- NAV -->
    <nav>
        <a href="./scrollmaxxing.html" class="nav-logo"><img src="icon.png" alt="">scrollmaxxing</a>
        <a href="./scrollmaxxing.html#download" class="nav-cta">Download</a>
    </nav>

    <!-- PAGE HERO -->
    <section class="page-hero">
        <p class="section-label">Legal</p>
        <h1>Terms of Service</h1>
        <p>If the document below doesn't load, <a href="./scrollmaxxing_terms.pdf" target="_blank">download the PDF directly</a>.</p>
    </section>

    <main>
        <div class="doc-card">
            <iframe src="https://docs.google.com/gview?url=https://monroyindustries-git.github.io/ScrollMaxxing/scrollmaxxing_terms.pdf&embedded=true"></iframe>
        </div>
    </main>

    <!-- FOOTER -->
    <footer>
        <div class="footer-inner">
            <div>
                <div class="footer-brand">scrollmaxxing</div>
                <p style="font-size: 14px;">how cooked is your screen time?</p>
                <p style="font-size: 13px; margin-top: 16px;">&copy; 2026 Monroy Industries</p>
            </div>
            <div class="footer-links">
                <div class="footer-col">
                    <h4>Legal</h4>
                    <a href="./scrollmaxxing-privacy.html">Privacy Policy</a>
                    <a href="./scrollmaxxing-termsofservice.html">Terms of Service</a>
                </div>
                <div class="footer-col">
                    <h4>Support</h4>
                    <a href="./scrollmaxxing-support.html">Support</a>
                </div>
                <div class="footer-col">
                    <h4>Socials</h4>
                    <a href="#">TikTok</a>
                    <a href="#">Instagram</a>
                </div>
            </div>
        </div>
    </footer>

</body>
</html>
